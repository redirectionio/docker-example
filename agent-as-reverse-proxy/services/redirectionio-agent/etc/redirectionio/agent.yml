instance:
    name: "${INSTANCE_NAME}"

# Run the agent as a reverse proxy in front of the backend service
reverse_proxy:
    # Endpoints the reverse proxy listens to
    listen:
        - "tcp://0.0.0.0:80"

    agent:
        project_key: "${REDIRECTIONIO_PROJECT_KEY}"

    # Forward the traffic to the backend service (the "nginx" service of the docker-compose.yml file)
    forward:
        address: "nginx:80"

    http:
        compress: true
